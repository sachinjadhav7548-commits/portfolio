<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Contact</title>
  <style>
    /* Base Styles */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .contact-container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: #f8fafc;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-status {
      margin-top: 1rem;
      font-size: 0.875rem;
    }

    .form-status.ok {
      color: var(--success);
    }

    .form-status.err {
      color: var(--error);
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <form id="contactForm">
      <div class="form-group">
        <label for="cf-name">Name</label>
        <input type="text" id="cf-name" name="name" required />
      </div>

      <div class="form-group">
        <label for="cf-email">Email</label>
        <input type="email" id="cf-email" name="email" required />
      </div>

      <div class="form-group">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" rows="4" required></textarea>
      </div>

      <button type="submit" id="cf-submit">Send message</button>

      <div id="cf-status" class="form-status"></div>
    </form>
  </div>

  <script>
    // Contact Form Submission (Backend API Integration)
    const contactForm = document.getElementById('contactForm');
    const formStatus = document.getElementById('cf-status');

    if (contactForm) {
      contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('cf-submit');
        
        // Get input values
        const name = document.getElementById('cf-name').value;
        const email = document.getElementById('cf-email').value;
        const message = document.getElementById('cf-message').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
        if (formStatus) {
          formStatus.textContent = '';
          formStatus.className = 'form-status';
        }

        try {
          // Send request to running backend on port 5000
          const response = await fetch('http://localhost:5000/api/contact', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ name, email, message }),
          });

          const data = await response.json();

          if (response.ok) {
            if (formStatus) {
              formStatus.textContent = 'Thank you! Your message has been sent successfully.';
              formStatus.className = 'form-status ok';
            }
            contactForm.reset();
          } else {
            throw new Error(data.message || 'Failed to send message.');
          }
        } catch (error) {
          console.error(error);
          if (formStatus) {
            formStatus.textContent = 'Failed to send message. Please try again later.';
            formStatus.className = 'form-status err';
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send message';
        }
      });
    }
  </script>
</body>
</html>
